name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bicep:
    name: Bicep build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Bicep CLI
        run: |
          curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep
          sudo mv bicep /usr/local/bin/bicep
          bicep --version

      - name: Build infra/main.bicep (fails on warnings)
        run: |
          set -e
          bicep build infra/main.bicep --outfile /tmp/main.json 2> bicep.log
          cat bicep.log
          if grep -E "Warning|Error" bicep.log; then
            echo "::error::Bicep emitted warnings or errors"
            exit 1
          fi

      - name: Upload built ARM template
        uses: actions/upload-artifact@v4
        with:
          name: arm-template
          path: /tmp/main.json
          retention-days: 7

  psrule:
    name: PSRule for Azure
    runs-on: ubuntu-latest
    needs: bicep
    steps:
      - uses: actions/checkout@v6

      - name: Run PSRule analysis
        uses: microsoft/ps-rule@v2.9.0
        with:
          modules: PSRule.Rules.Azure
          inputPath: infra/
          outputFormat: Sarif
          outputPath: ps-rule.sarif.json
          summary: true
        env:
          # Tell PSRule.Rules.Azure to expand Bicep at scan time.
          PSRULE_CONFIGURATION_AZURE_BICEP_FILE_EXPANSION: "true"
          PSRULE_CONFIGURATION_AZURE_BICEP_FILE_EXPANSION_TIMEOUT: "30"

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psrule-sarif
          path: ps-rule.sarif.json
          retention-days: 14

  policy-xml:
    name: APIM policy XML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils

      - name: xmllint --noout (well-formedness)
        run: |
          set -e
          shopt -s nullglob
          fail=0
          for f in infra/modules/policies/*.xml; do
            echo "::group::$f"
            if ! xmllint --noout "$f"; then
              echo "::error file=$f::malformed XML"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      - name: Detect unescaped < and bare & inside attribute values
        # APIM policy expressions like `i < p.Length` or `As<string>` MUST be
        # escaped (`&lt; &amp;`) when they live inside an attribute value.
        # `<set-body>` element content can use CDATA. Per XML spec, raw `>`
        # is permitted in attribute values, so we only flag `<` and bare `&`.
        run: |
          set -e
          fail=0
          for f in infra/modules/policies/*.xml; do
            python3 - "$f" <<'PY' || fail=1
          import re, sys
          path = sys.argv[1]
          src = open(path, encoding='utf-8').read()
          # Strip CDATA blocks first — anything goes inside them.
          src_no_cdata = re.sub(r'<!\[CDATA\[.*?\]\]>', '', src, flags=re.DOTALL)
          # Strip XML comments.
          src_no_cdata = re.sub(r'<!--.*?-->', '', src_no_cdata, flags=re.DOTALL)
          # Pull each attribute="..." or attribute='...' pair.
          attr = re.compile(r'''(\w[\w:-]*)\s*=\s*("([^"]*)"|'([^']*)')''')
          bad_amp = re.compile(r'&(?!(lt|gt|amp|quot|apos|#\d+|#x[0-9A-Fa-f]+);)')
          problems = []
          for m in attr.finditer(src_no_cdata):
              name = m.group(1)
              val  = m.group(3) if m.group(3) is not None else m.group(4)
              if val is None:
                  continue
              if '<' in val:
                  problems.append((name, '<', val[:120]))
              if bad_amp.search(val):
                  problems.append((name, '&', val[:120]))
          if problems:
              print(f'::error file={path}::found {len(problems)} unescaped char(s) in attribute values')
              for n, c, v in problems[:10]:
                  print(f'  attr={n!r} bad={c!r} value={v!r}')
              sys.exit(1)
          print(f'{path}: ok')
          PY
          done
          exit $fail

  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "**/*.md"

  python:
    name: Function App lint, test, security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install runtime + dev deps
        working-directory: src/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          # Ruff is not in requirements-dev.txt because it is also needed
          # standalone in editor configs; keep it pinned here.
          pip install "ruff~=0.6"

      - name: Ruff
        working-directory: src/api
        run: ruff check .

      - name: Import smoke test
        working-directory: src/api
        run: python -c "import function_app; print('ok')"

      - name: Pytest with coverage
        working-directory: src/api
        run: |
          python -m pytest \
            --cov \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=pytest-junit.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: src/api/coverage.xml
          flags: python
          fail_ci_if_error: false
          # Tokenless upload works for public repos.

      - name: Upload pytest + coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results
          path: |
            src/api/coverage.xml
            src/api/pytest-junit.xml
          retention-days: 14

      - name: Bandit (security scan)
        working-directory: src/api
        run: |
          # -ll = report only Medium and High severity findings.
          # Config (skip B101 in tests, exclude tests/) lives in pyproject.toml.
          python -m bandit -r . -ll -c pyproject.toml \
            -f sarif -o bandit.sarif || true
          # Re-run with terminal output to fail the job on findings.
          python -m bandit -r . -ll -c pyproject.toml

      - name: Upload Bandit SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-sarif
          path: src/api/bandit.sarif
          retention-days: 14


  powershell:
    name: PowerShell script analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer `
            -Path scripts `
            -Recurse `
            -Settings scripts/PSScriptAnalyzerSettings.psd1 `
            -Severity Warning,Error
          if ($results) {
            $results | Format-Table -AutoSize | Out-String | Write-Host
            Write-Error "PSScriptAnalyzer found $($results.Count) issue(s)."
            exit 1
          }
          Write-Host "PSScriptAnalyzer: clean."

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

