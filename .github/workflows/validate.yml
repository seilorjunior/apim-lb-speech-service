name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bicep:
    name: Bicep build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Bicep CLI
        run: |
          curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep
          sudo mv bicep /usr/local/bin/bicep
          bicep --version

      - name: Build infra/main.bicep (fails on warnings)
        run: |
          set -e
          bicep build infra/main.bicep --outfile /tmp/main.json 2> bicep.log
          cat bicep.log
          if grep -E "Warning|Error" bicep.log; then
            echo "::error::Bicep emitted warnings or errors"
            exit 1
          fi

  python:
    name: Function App lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install lint deps
        working-directory: src/api
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -r requirements.txt

      - name: Ruff
        working-directory: src/api
        run: ruff check .

      - name: Import smoke test
        working-directory: src/api
        run: python -c "import function_app; print('ok')"

  powershell:
    name: PowerShell script analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer `
            -Path scripts `
            -Recurse `
            -Settings scripts/PSScriptAnalyzerSettings.psd1 `
            -Severity Warning,Error
          if ($results) {
            $results | Format-Table -AutoSize | Out-String | Write-Host
            Write-Error "PSScriptAnalyzer found $($results.Count) issue(s)."
            exit 1
          }
          Write-Host "PSScriptAnalyzer: clean."
