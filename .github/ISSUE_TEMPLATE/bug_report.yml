name: Bug report
description: Something in this template is broken or behaves unexpectedly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please scrub anything
        sensitive (subscription IDs, tenant IDs, principal IDs, real
        endpoints) before posting.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: e.g. `azd up` succeeded but `/api/transcribe` returns 502.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. azd env new dev
        2. azd up
        3. ...
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Repo commit / tag
      placeholder: e.g. `main @ abcd123` or `v1.0.0`
    validations:
      required: true
  - type: input
    id: azd-version
    attributes:
      label: azd version
      placeholder: output of `azd version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / shell
      placeholder: e.g. Windows 11 / pwsh 7.4
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        Slice of `azd up` output, APIM trace, or App Insights request id.
        Wrap in triple backticks and **redact secrets**.
      render: shell
